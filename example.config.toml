# Qwesty Configuration Example
# Rename to config.toml to use this file

[discord]
# Your Discord user token
token = "your_discord_user_token"

# Locale mode: "single" (one locale) or "all" (check all supported locales)
locale_mode = "single"

# Discord super properties header (X-Super-Properties) base64 JSON string
# Optional: if not set or invalid, a default fallback will be used automatically
super_properties = "your_base64_super_properties"

# Discord webhook entries for notifications (collector mode only)
# If role = "collector", at least one [[discord.webhooks]] entry is required.
# If role = "agent", webhooks are optional and can be removed.

## Multiple webhooks example:
[[discord.webhooks]]
name = "Channel A"
url = "https://discordapp.com/api/webhooks/YOUR_ID/YOUR_TOKEN"
# message = "hai everyone!"

# [[discord.webhooks]]
# name = "Channel B"
# url = "https://discordapp.com/api/webhooks/YOUR_ID/YOUR_TOKEN_B"
# message = "hai everyone!"

# you can add more webhook entries as needed

[notifier]
# Filter quests by reward type: "all", "orbs", or "decor"
reward_filter = "all"

# How often to check for new quests (in minutes)
fetch_interval_minutes = 30

# Exit after first check (useful for cron jobs)
run_once = false

# Storage type: "json" (persistent file-based) or "memory" (in-memory only)
storage_type = "memory"

# Path where to store the JSON file (relative or absolute)
# If u're using Pterodactyl or similar, make sure to set this to a writable path outside of the app's code directory, e.g. "/home/container/known-quests.json"
storage_path = "./known-quests.json"

# If true, the notifier will send notifications for all currently available quests on first run.
# If false (default), it will treat existing quests as already seen and not notify on first run.
initial_send_all = false

[mode]
# role can be "agent" or "collector"
# For a simple single-instance setup, use "collector" role.
# Collector fetches quests and sends notifications via configured webhooks.
role = "collector"

# For agents only: where to send ingestion (required when role = "agent")
# collector_url = "https://host-a.example.com/ingest"
# collector_token = "super-secret"

# For collector only: token to accept from agents (optional if not using remote agents)
# accept_token = "super-secret"

# For collector only: port for ingest server (default 8080)
# ingest_port = 8080

[region]
# Region code like "en-US", "ko-KR", etc. Collector also acts for its local region.
code = "en-US"
